<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Interpreter</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, 'Times New Roman', Times, serif;
            background: #16181c;
            color: #f4f6fb;
        }
        .container {
            display: flex;
            height: 100vh;
            background: #16181c;
        }
        .left {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: #181b23;
            padding-top: 32px;
            min-width: 500px;
            min-height: 500px;
        }
        .right {
            flex: 1;
            padding: 40px 32px;
            background: #181b23;
            box-shadow: -2px 0 8px rgba(0,0,0,0.32);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            margin-right: 30px;
            border-radius: 16px;
        }
        #webcam {
            width: 480px;
            height: 480px;
            max-width: 480px;
            max-height: 480px;
            border-radius: 16px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.13);
            border: 4px solid #fff;
            background: #000;
            transform: scaleX(-1); /* Mirror horizontally */
        }
        h2 {
            margin-top: 0;
            color: #2d2d2d;
        }
        #detected-signs {
            margin-top: 32px;
            font-size: 1.5rem;
            color: #444;
            min-height: 2em;
        }
        .site-title {
            width: 100vw;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 32px 0 18px 0;
            background: #181b23;
            color: #7ea7ff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        .circular-progress {
            display: inline-block;
            width: 32px;
            height: 32px;
            vertical-align: middle;
            margin-right: 12px;
        }
        .circular-progress svg {
            transform: rotate(-90deg);
        }
        .circular-bg {
            stroke: #2d3748;
        }
        .circular-bar {
            stroke: url(#blue-gradient);
            transition: stroke-dasharray 0.2s;
            filter: drop-shadow(0 0 3px #7ecbff);
        }
    </style>
</head>
<body>
    <div class="site-title">Sign Language Interpreter</div>
    <div class="container">
        <div class="left">
            <video id="webcam" autoplay playsinline style="width:480px; height:480px; border-radius:16px; box-shadow:0 2px 24px #000; margin-top:0; border: 2px solid #1a237e; background: #101217;"></video>
        </div>
        <div class="right">
            <h2 style="color:#7ecbff;margin:0 0 18px 0;">Welcome to Sign Language Interpreter</h2>
            <div id="countdown" style="font-size:2rem;color:#ff7e7e;margin-bottom:24px;"></div>
            <div id="detected-signs" style="color:#fff;">No sign detected yet.</div>
            <div style="display:flex;justify-content:flex-end;margin-top:18px;margin-bottom:2px;">
                <button id="toggle-detection" style="background:#232634;color:#ffb347;border:1px solid #ffb347;border-radius:8px;padding:6px 16px;cursor:pointer;font-size:1rem;">Pause Detection</button>
            </div>
            <div style="font-size:1.08rem;color:#7ecbff;font-weight:600;margin-bottom:6px;">Forming your sentence here</div>
            <div id="sentence-area" style="font-size:1.3rem;color:#fff;background:#232634;padding:12px 18px;border-radius:8px;margin:8px 0 12px 0;min-height:32px;box-shadow:0 1px 4px #0002;letter-spacing:1px;"></div>
            <div style="display:flex;justify-content:flex-end;">
                <button id="clear-sentence" style="background:#232634;color:#7ecbff;border:1px solid #7ecbff;border-radius:8px;padding:6px 16px;cursor:pointer;font-size:1rem;">Clear Sentence</button>
            </div>
        </div>
    </div>
    <script>
        // Webcam stream setup
        const video = document.getElementById('webcam');
        const detectedSigns = document.getElementById('detected-signs');
        const countdownDiv = document.getElementById('countdown');
        let streaming = false;
        let detecting = false;
        let pauseTimeout = null;
        let detectionLoopId = null;

        // Create overlay canvas for box
        const overlay = document.createElement('canvas');
        overlay.width = 480;
        overlay.height = 480;
        overlay.style.position = 'absolute';
        overlay.style.left = video.offsetLeft + 'px';
        overlay.style.top = video.offsetTop + 'px';
        overlay.style.pointerEvents = 'none';
        overlay.style.width = video.style.width || '480px';
        overlay.style.height = video.style.height || '480px';
        document.querySelector('.left').appendChild(overlay);

        function drawBox() {
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            const boxSize = 300;
            const boxX = overlay.width/2 - boxSize/2;
            const boxY = overlay.height/2 - boxSize/2;
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 3;
            ctx.strokeRect(boxX, boxY, boxSize, boxSize);
        }

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                streaming = true;
                video.addEventListener('playing', () => {
                    drawBox();
                    startCountdown();
                });
            })
            .catch(err => {
                detectedSigns.innerText = 'Could not access webcam.';
            });

        function startCountdown() {
            countdownValue = 3;
            countdownPaused = false;
            countdownDiv.innerText = `Starting in ${countdownValue}...`;
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                if (detectionPaused) {
                    countdownPaused = true;
                    return;
                }
                if (!countdownPaused) {
                    countdownValue--;
                    if (countdownValue > 0) {
                        countdownDiv.innerText = `Starting in ${countdownValue}...`;
                    } else {
                        clearInterval(countdownInterval);
                        countdownDiv.innerText = '';
                        detecting = true;
                        detectedSigns.innerText = '';
                        startDetectionLoop();
                    }
                }
            }, 1000);
        }

        function startDetectionLoop() {
            detectionLoopId = setInterval(captureAndSendFrame, 200);
        }

        function stopDetectionLoop() {
            if (detectionLoopId) clearInterval(detectionLoopId);
            detectionLoopId = null;
        }

        let lastGesture = null;
        let lastConfidence = null;
        let sentence = [];

        // Detection and countdown control variables (global scope)
        var detectionPaused = false;
        var countdownPaused = false;
        var countdownValue = 3;
        var countdownInterval = null;

        async function captureAndSendFrame() {
            if (!streaming || !detecting || detectionPaused) return;
            try {
                // Wait for video to be ready and have valid size
                let vw = video.videoWidth;
                let vh = video.videoHeight;
                if (!vw || !vh || vw === 0 || vh === 0) {
                    // Try again soon
                    setTimeout(captureAndSendFrame, 100);
                    return;
                }
                // Create a canvas to capture the current frame
                const canvas = document.createElement('canvas');
                canvas.width = vw;
                canvas.height = vh;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, vw, vh);
                // Convert to blob
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
                if (!blob) {
                    detectedSigns.innerText = 'Camera not ready, retrying...';
                    setTimeout(captureAndSendFrame, 100);
                    return;
                }
                // Send to backend
                const formData = new FormData();
                formData.append('file', blob, 'frame.jpg');
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.prediction) {
                        lastGesture = data.prediction;
                        lastConfidence = data.confidence;
                        detectedSigns.innerText = `${lastGesture} (${(lastConfidence*100).toFixed(1)}%)`;
                        // Add to sentence if not repeat of last
                        if (sentence.length === 0 || sentence[sentence.length-1] !== lastGesture) {
                            sentence.push(lastGesture);
                            updateSentenceArea();
                        }
                        detecting = false;
                        stopDetectionLoop();
                        countdownDiv.innerHTML = `<span style='color:#00bfae;font-weight:600;font-size:1.25rem;'>Here's your detected gesture</span>`;
                        // Keep showing detected gesture during pause
                        pauseTimeout = setTimeout(() => {
                            lastGesture = null;
                            lastConfidence = null;
                            startCountdown();
                        }, 5000); // 5s pause
                    } else {
                        // Show circular progress and frames collected
                        let n = data.buffer_len || 0;
                        let progress = Math.min(n, 30);
                        let percent = progress / 30;
                        let radius = 14;
                        let circ = 2 * Math.PI * radius;
                        let dash = circ * percent;
                        detectedSigns.innerHTML = `
                        <span class="circular-progress">
                            <svg width="32" height="32">
                                <defs>
                                    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#1976d2"/>
                                        <stop offset="100%" stop-color="#64b5f6"/>
                                    </linearGradient>
                                </defs>
                                <circle class="circular-bg" cx="16" cy="16" r="14" fill="none" stroke-width="4" />
                                <circle class="circular-bar" cx="16" cy="16" r="14" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${dash},${circ-dash}" />
                            </svg>
                        </span>
                        Collecting gesture: <b>${progress} / 30</b>`;
                    }
                } else {
                    detectedSigns.innerText = 'Backend error.';
                }
            } catch (e) {
                detectedSigns.innerText = 'Camera or backend not ready, retrying...';
                setTimeout(captureAndSendFrame, 200);
            }
        }

        // Ensure last detected gesture remains visible during pause
        function showLastGesture() {
            if (lastGesture && lastConfidence !== null) {
                detectedSigns.innerText = `${lastGesture} (${(lastConfidence*100).toFixed(1)}%)`;
            }
        }

        // Pause/Resume detection logic
        document.getElementById('toggle-detection').onclick = function() {
            detectionPaused = !detectionPaused;
            this.innerText = detectionPaused ? 'Resume Detection' : 'Pause Detection';
            this.style.color = detectionPaused ? '#7ecbff' : '#ffb347';
            this.style.borderColor = detectionPaused ? '#7ecbff' : '#ffb347';
            if (!detectionPaused) {
                // Resume countdown if it was paused
                if (countdownPaused && countdownValue > 0) {
                    countdownPaused = false;
                }
                // If not detecting, and countdown is not running, start countdown
                if (!detecting && countdownDiv.innerText.startsWith('Starting')) {
                    // Already in countdown, let the interval handle it
                } else if (!detecting && !countdownDiv.innerText) {
                    startCountdown();
                }
            }
        };

        // Patch: show last gesture during pause
        const origStartCountdown = startCountdown;
        startCountdown = function() {
            lastGesture = null;
            lastConfidence = null;
            origStartCountdown();
        };

        // Also, during pause, keep showing last gesture
        setInterval(() => {
            if (!detecting && lastGesture && lastConfidence !== null) {
                showLastGesture();
            }
        }, 200);

        // --- Sentence UI logic ---
        function updateSentenceArea() {
            document.getElementById('sentence-area').innerText = sentence.join(' ');
        }
        document.getElementById('clear-sentence').onclick = function() {
            sentence = [];
            updateSentenceArea();
        };
        // Initialize
        updateSentenceArea();
    </script>
</body>
</html>
